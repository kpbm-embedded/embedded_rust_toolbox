[package]
name = "riscv_qemu_virt"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
riscv = { version = "0.16.1", features = ["critical-section-single-hart"] }
riscv-rt = { version = "0.18.0", features = ["single-hart"] }

[profile.release]
debug = 2
opt-level = "s"
lto = "fat"
codegen-units = 1
