[package]
name = "defmt_test_pico"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
harness = false
test = false

[[test]]
name = "on_target"
harness = false

[dependencies]
defmt = "1.2.0"

[dev-dependencies]
defmt-test = "0.5.1"
defmt-rtt = "1.3.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
rp2040-hal = { version = "0.12.0", features = ["rt", "critical-section-impl", "defmt"] }
rp2040-boot2 = "0.3.0"
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"

[profile.release]
debug = 2
opt-level = "s"
lto = "fat"
codegen-units = 1
incremental = false

[profile.dev]
opt-level = "s"
