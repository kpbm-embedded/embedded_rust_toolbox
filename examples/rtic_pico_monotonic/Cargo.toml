[package]
name = "rtic_pico_monotonic"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
rtic = { version = "2.4.0", features = ["thumbv6-backend"] }
rtic-monotonics = { version = "3.0.0", features = ["rp2040"] }
rp2040-hal = { version = "0.12.0", features = ["rt", "critical-section-impl", "defmt"] }
rp2040-boot2 = "0.3.0"
embedded-hal = "1.0.0"
portable-atomic = { version = "1.15", features = ["critical-section"] }  # CAS on Cortex-M0+ (RTIC executor)
defmt = "1.2.0"
defmt-rtt = "1.3.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"

[profile.release]
debug = 2
opt-level = "s"
lto = "fat"
codegen-units = 1
incremental = false

[profile.dev]
opt-level = "s"
