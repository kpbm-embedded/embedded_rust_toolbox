[package]
name = "embassy_stm32_family"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# One source, three WeAct boards: pick exactly one chip feature (the target differs: H5 is a Cortex-M33).
[features]
g431 = ["embassy-stm32/stm32g431cb"]   # WeAct STM32G431CBU6 core board, thumbv7em-none-eabihf
h562 = ["embassy-stm32/stm32h562rg"]   # WeAct STM32H562RGT6, thumbv8m.main-none-eabihf
h743 = ["embassy-stm32/stm32h743vi"]   # WeAct MiniSTM32H743VIT6, thumbv7em-none-eabihf

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "unstable-pac", "memory-x", "time-driver-any", "exti"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
defmt = "1.2.0"
defmt-rtt = "1.3.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"

[profile.release]
debug = 2
opt-level = "s"
lto = "fat"
codegen-units = 1
incremental = false
