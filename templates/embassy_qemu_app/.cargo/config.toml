# Runs on QEMU's mps2-an385 (Arm MPS2 FPGA image, Cortex-M3), no board needed:
# `cargo run --release` starts the pinned qemu-system-arm from ./rust-box.
[build]
target = "thumbv7m-none-eabi"

[target.thumbv7m-none-eabi]
runner = "qemu-system-arm -machine mps2-an385 -nographic -monitor none -semihosting-config enable=on,target=native -kernel"
rustflags = ["-C", "link-arg=-Tlink.x"]
