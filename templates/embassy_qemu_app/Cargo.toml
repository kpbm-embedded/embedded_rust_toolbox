[package]
name = "@NAME@"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000"] }
embassy-time-driver = "0.2.2"
embassy-time-queue-utils = { version = "0.3.2", features = ["generic-queue-8"] }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
critical-section = "1.2"
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
cortex-m-semihosting = "0.6.0"
panic-semihosting = { version = "0.7.0", features = ["exit"] }

[profile.release]
debug = 2
opt-level = "s"
lto = "fat"
codegen-units = 1
