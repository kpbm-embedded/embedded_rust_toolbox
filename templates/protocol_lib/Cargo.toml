[package]
name = "@NAME@"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "no_std, no-alloc telemetry protocol: serde + postcard + COBS frames, heapless containers"

[dependencies]
heapless = { version = "0.9.3", features = ["serde"] }
postcard = { version = "1.1.3", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
