[package]
name = "@NAME@"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "embedded-hal-async SPI NOR flash driver (W25Qxx), unit-tested on the host with embedded-hal-mock"

[dependencies]
embedded-hal-async = "1.0.0"

[dev-dependencies]
embedded-hal-mock = { version = "0.11.1", default-features = false, features = ["eh1", "embedded-hal-async"] }
embassy-futures = "0.1.2"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
