# Cross build for the board; flip-link (in-ID, pinned) wraps rust-lld for zero-cost stack
# overflow protection. No runner on purpose: `cargo run` would flash a board. Use
# rust-box plan pico <elf> to see the flash command, or uncomment:
# [target.thumbv6m-none-eabi]
# runner = "probe-rs run --chip RP2040"   # makes `cargo run` FLASH the board
[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
linker = "flip-link"

[env]
DEFMT_LOG = "debug"
