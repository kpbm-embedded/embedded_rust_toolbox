# Runs on QEMU lm3s6965evb. Build through example.sh (or set ZIG_LIB_DIR to a folder with libzigdsp.a
# from zig/dsp.zig): `cargo run --release` then starts the pinned qemu-system-arm.
[build]
target = "thumbv7m-none-eabi"

[target.thumbv7m-none-eabi]
runner = "qemu-system-arm -cpu cortex-m3 -machine lm3s6965evb -nographic -monitor none -semihosting-config enable=on,target=native -kernel"
rustflags = ["-C", "link-arg=-Tlink.x"]
