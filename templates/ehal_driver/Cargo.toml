[package]
name = "@NAME@"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "embedded-hal 1.0 I2C driver for a TMP117 temperature sensor, unit-tested on the host with embedded-hal-mock"

[features]
defmt = ["dep:defmt"]

[dependencies]
embedded-hal = "1.0.0"
defmt = { version = "1.2.0", optional = true }

[dev-dependencies]
embedded-hal-mock = { version = "0.11.1", default-features = false, features = ["eh1"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
