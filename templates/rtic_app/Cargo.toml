[package]
name = "@NAME@"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
rtic = { version = "2.4.0", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "3.0.0", features = ["cortex-m-systick"] }
rtic-sync = "1.6.0"
stm32f4xx-hal = { version = "0.23.0", features = ["stm32f411", "defmt"] }
defmt = "1.2.0"
defmt-rtt = "1.3.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"

[profile.release]
debug = 2
opt-level = "s"
lto = "fat"
codegen-units = 1
incremental = false

[profile.dev]
opt-level = "s"
